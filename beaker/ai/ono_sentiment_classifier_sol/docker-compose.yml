name: sentiment-training
x-node: &node
  build:
    context: ./external/ono
    dockerfile: node/Dockerfile
    args:
      MODE: release
  deploy:
    resources:
      limits:
        cpus: "1"
  networks: [training-network]

x-listen-check: &listen-check
  interval: 2s
  timeout: 2s
  retries: 30

services:
  node-0:
    <<: *node
    container_name: node-0
    environment: { HOST: 0.0.0.0, PORT: "40000", RUST_LOG: info }
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':9C40 00000000:0000 0A ' /proc/net/tcp"]
      <<: *listen-check
  node-1:
    <<: *node
    container_name: node-1
    environment: { HOST: 0.0.0.0, PORT: "40001", RUST_LOG: info }
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':9C41 00000000:0000 0A ' /proc/net/tcp"]
      <<: *listen-check
  node-2:
    <<: *node
    container_name: node-2
    environment: { HOST: 0.0.0.0, PORT: "40002", RUST_LOG: info }
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':9C42 00000000:0000 0A ' /proc/net/tcp"]
      <<: *listen-check

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    container_name: orchestrator
    depends_on:
      node-0: { condition: service_healthy }
      node-1: { condition: service_healthy }
      node-2: { condition: service_healthy }
    environment:
      NODES: "3"
      RUST_LOG: info
      MAX_ROWS: "${MAX_ROWS:-}"
      N_FEATURES: "${N_FEATURES:-2000}"
      MAX_EPOCHS: "${MAX_EPOCHS:-40}"
      BATCH_SIZE: "${BATCH_SIZE:-256}"
      OPTIMIZER: "${OPTIMIZER:-gd}"
      LR: "${LR:-1.0}"
      MOMENTUM: "${MOMENTUM:-0.9}"
      EARLY_STOPPING_TOLERANCE: "${EARLY_STOPPING_TOLERANCE:-0.00001}"
      PROCESSED_DIR: "${PROCESSED_DIR:-data/processed}"
      MODELS_DIR: "${MODELS_DIR:-models}"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks: [training-network]

networks:
  training-network:
    driver: bridge
