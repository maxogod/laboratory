name: go-websockets-e2e

services:
  api:
    build:
      context: .
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"
      PORT: 8080
      ENVIRONMENT: test
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      # Kept low and deterministic so the capacity test doesn't need to
      # open thousands of connections to prove the limit is enforced.
      WS_MAX_CONNECTIONS_PER_CHANNEL: 3
    networks:
      - e2e

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - e2e
    # No volume: every run starts from an empty database.

networks:
  e2e:
    driver: bridge
